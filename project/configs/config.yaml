project:
  name: ChurnGuard
  random_state: 42

data:
  train_path: data/churn_train.csv
  sample_path: data/churn_sample.csv
  n_samples: 1200
  test_size: 0.2

model:
  target: churn
  artifact_path: artifacts/churn_model.joblib
  metrics_path: artifacts/metrics.json
  final_model: random_forest
  random_forest:
    n_estimators: 160
    max_depth: 8
    min_samples_leaf: 4
  logistic_regression:
    max_iter: 1000

service:
  host: 127.0.0.1
  port: 8000
  decision_threshold: 0.5
